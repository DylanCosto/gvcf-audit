[package]
name = "gvcf-audit"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Explain genotype callability and missing evidence in a gVCF"
license = "MIT"
readme = "README.md"
repository = "https://github.com/DylanCosto/gvcf-audit"
keywords = ["bioinformatics", "genomics", "gvcf", "quality-control"]
categories = ["science", "command-line-utilities"]
include = ["src/**", "tests/**/*.rs", "tests/oracles/*.py", "tests/fixtures/**", "tests/README.md", ".github/workflows/*.yml", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "docs/**", "examples/**", "CHANGELOG.md"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
