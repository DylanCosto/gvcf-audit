name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked
      - run: cargo +stable build --locked
      - name: GIAB example interval checks
        run: python3 examples/giab/test_overlap.py
      - name: Independent synthetic checks
        run: python3 tests/oracles/run.py target/debug/gvcf-audit

  rust-1-88:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 test --locked
      - run: cargo +1.88.0 build --release --locked
      - name: Independent synthetic checks on the release build
        run: python3 tests/oracles/run.py target/release/gvcf-audit

  multiqc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --locked
      - name: Install MultiQC for the integration check
        run: |
          python3 -m venv "$RUNNER_TEMP/multiqc"
          "$RUNNER_TEMP/multiqc/bin/pip" install multiqc==1.35
      - run: python3 tests/integrations/multiqc.py target/debug/gvcf-audit "$RUNNER_TEMP/multiqc/bin/multiqc"

  weekly-random:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - run: cargo +stable build --release --locked
      - name: Synthetic checks with a fresh seed
        run: python3 tests/oracles/run.py target/release/gvcf-audit --random-seed
